name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Lint (informational, non-blocking) ──
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Lint
        run: npm run lint --workspaces --if-present
        continue-on-error: true

  # ── Validate DB schema by running migrations + seed against real Postgres ──
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: restro
          POSTGRES_PASSWORD: restro
          POSTGRES_DB: restrosaas_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U restro -d restrosaas_ci"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://restro:restro@localhost:5432/restrosaas_ci
      JWT_ACCESS_SECRET: ci_access_secret_min_32_characters_long
      JWT_REFRESH_SECRET: ci_refresh_secret_min_32_characters_long
      QR_TOKEN_SECRET: ci_qr_secret_min_32_characters_long_x
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Run migrations
        run: npm run db:migrate --workspace server
      - name: Run seed
        run: npm run db:seed --workspace server
      - name: Verify rollback works
        run: npm run db:rollback --workspace server

  # ── Build the client bundle ──
  build-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run build --workspace client
      - uses: actions/upload-artifact@v4
        with: { name: client-dist, path: client/dist, retention-days: 5 }

  # ── Build Docker images (push to GHCR only on main) ──
  docker:
    runs-on: ubuntu-latest
    needs: [migrations, build-client]
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}/api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build client image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}/client:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
