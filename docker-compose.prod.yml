# Production stack: postgres + api + client(static) behind an NGINX edge proxy.
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  api:
    build: { context: ./server, dockerfile: Dockerfile }
    restart: always
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
    env_file: [.env.prod]
    # Run migrations, then boot. (Seed intentionally omitted in prod.)
    command: sh -c "node src/db/migrate.js up && node src/server.js"
    networks: [internal]

  client:
    build: { context: ./client, dockerfile: Dockerfile }
    restart: always
    depends_on: [api]
    networks: [internal]

  nginx:
    image: nginx:1.27-alpine
    restart: always
    depends_on: [api, client]
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks: [internal]

volumes:
  pgdata:

networks:
  internal:
    driver: bridge
