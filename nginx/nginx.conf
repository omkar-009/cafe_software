# ─────────────────────────────────────────────────────────────
#  Production edge reverse proxy.
#  Terminates TLS (when certs mounted), applies rate limiting +
#  security headers, and routes:
#     /api/       → api:4000       (REST)
#     /socket.io/ → api:4000       (WebSocket)
#     /           → client:80      (static SPA)
# ─────────────────────────────────────────────────────────────
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 2048; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
  access_log /var/log/nginx/access.log main;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

  # Rate limiting zones (edge-level, complements the app rate limiter)
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

  # Shared proxy headers
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  upstream api_upstream    { server api:4000;   keepalive 32; }
  upstream client_upstream { server client:80;  keepalive 16; }

  # Redirect HTTP → HTTPS (enable once certs are present)
  # server {
  #   listen 80;
  #   server_name _;
  #   return 301 https://$host$request_uri;
  # }

  server {
    listen 80 default_server;
    # listen 443 ssl http2;
    server_name _;

    # ── TLS (mount certs to /etc/nginx/certs) ──
    # ssl_certificate     /etc/nginx/certs/fullchain.pem;
    # ssl_certificate_key /etc/nginx/certs/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers HIGH:!aNULL:!MD5;
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 5m;

    location = /health {
      proxy_pass http://api_upstream/health;
    }

    location /api/v1/auth/ {
      limit_req zone=auth burst=10 nodelay;
      proxy_pass http://api_upstream;
    }

    location /api/ {
      limit_req zone=api burst=40 nodelay;
      proxy_pass http://api_upstream;
    }

    location /socket.io/ {
      proxy_pass http://api_upstream;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 3600s;
    }

    location / {
      proxy_pass http://client_upstream;
    }
  }
}
